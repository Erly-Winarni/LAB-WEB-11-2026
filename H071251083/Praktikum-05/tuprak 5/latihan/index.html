<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pantau Tugas Tim</title>
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="bg-gray-100 text-gray-800">
  <header class="bg-blue-600 text-white p-4 text-center">
    <h1 class="text-2xl font-bold">Pantau Tugas Tim</h1>
  </header>

  <main class="max-w-4xl mx-auto p-4 grid grid-cols-1 md:grid-cols-3 gap-4">
    <!-- F1: daftar anggota -->
    <section class="bg-white p-4 rounded-lg border border-gray-300 md:col-span-1">
      <h2 class="text-lg font-semibold mb-2">Anggota Tim</h2>
      <p id="status-anggota" class="text-sm text-gray-500"></p>
      <div id="daftar-anggota" class="flex flex-col gap-2"></div>
    </section>

    <!-- F2-F5: tugas anggota -->
    <section class="bg-white p-4 rounded-lg border border-gray-300 md:col-span-2">
      <h2 id="judul-tugas" class="text-lg font-semibold">Pilih anggota untuk melihat tugas</h2>
      <p id="ringkasan" class="text-sm text-gray-600 mb-2"></p>
      <p id="status-tugas" class="text-sm text-gray-500 mb-2"></p>

      <!-- F3: pencarian -->
      <input id="cari" type="text" placeholder="Cari tugas berdasarkan judul..."
        class="w-full border border-gray-300 p-2 rounded mb-2 focus:border-blue-500 focus:outline-none">

      <ul id="daftar-tugas" class="space-y-2"></ul>
      <p id="kosong" class="hidden text-sm text-gray-500 mt-2">Tidak ada tugas yang cocok</p>

      <!-- F4: tambah tugas -->
      <form id="form-tugas" class="mt-4 flex gap-2">
        <input id="judul-baru" type="text" placeholder="Judul tugas baru"
          class="flex-1 border border-gray-300 p-2 rounded focus:border-blue-500 focus:outline-none">
        <button id="tombol-simpan" type="submit"
          class="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded">Simpan</button>
      </form>
      <p id="error-form" class="text-sm text-red-600 mt-1"></p>
      <p id="notifikasi" class="text-sm text-green-600 mt-1"></p>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
