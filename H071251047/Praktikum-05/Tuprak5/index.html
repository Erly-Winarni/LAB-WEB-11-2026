<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Tugas Tim Marsha</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Mencegah scrollbar yang terlalu tebal di panel tugas */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 font-sans h-screen flex flex-col md:flex-row overflow-hidden">

    <!-- SIDEBAR: F1. Menampilkan Daftar Anggota -->
    <aside class="w-full md:w-1/3 lg:w-1/4 bg-white border-r border-slate-200 h-1/3 md:h-full flex flex-col shadow-sm z-10">
        <div class="p-5 border-b border-slate-100 bg-white">
            <h1 class="text-xl font-bold text-indigo-600">Tim Marsha</h1>
            <p class="text-sm text-slate-500">Daftar Anggota Tim</p>
        </div>
        
        <div class="p-4 flex-1 overflow-y-auto">
            <!-- Loading / Error untuk Anggota -->
            <p id="users-msg" class="text-sm text-slate-500 italic">Memuat anggota...</p>
            
            <!-- (createElement) -->
            <div id="users-list" class="flex flex-col gap-2"></div>
        </div>
    </aside>

    <!-- KONTEN UTAMA: Panel Tugas -->
    <main class="w-full md:w-2/3 lg:w-3/4 h-2/3 md:h-full flex flex-col relative bg-slate-50">
        
        <!-- Status awal sebelum anggota diklik -->
        <div id="welcome-panel" class="flex flex-col items-center justify-center h-full text-slate-400">
            <svg class="w-16 h-16 mb-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M15 15l-2 5L9 9l11 4-5 2zm0 0l5 5M7.188 2.239l.777 2.897M5.136 7.965l-2.898-.777M13.95 4.05l-2.122 2.122m-5.657 5.656l-2.12 2.122"></path></svg>
            <p class="text-lg font-medium">Pilih anggota tim untuk melihat tugas</p>
        </div>

        <!-- Panel Tugas Utama -->
        <div id="todo-panel" class="hidden flex-col h-full">
            
            <!-- HEADER TUGAS -->
            <div class="p-6 bg-white border-b border-slate-200 shadow-sm shrink-0">
                <h2 id="todo-title" class="text-2xl font-bold text-slate-800 mb-1">Tugas Anggota</h2>
                <!-- F2 Poin 6: Ringkasan X dari Y tugas selesai -->
                <p id="todo-summary" class="text-sm font-medium text-indigo-600 bg-indigo-50 inline-block px-3 py-1 rounded-full mt-2">0 dari 0 tugas selesai</p>
                
                <div class="mt-6 flex flex-col lg:flex-row gap-4">
                    <!-- F3.kotak pencarian -->
                    <div class="flex-1 relative">
                        <input type="text" id="search-input" placeholder="Cari tugas..." class="w-full pl-10 pr-4 py-2 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 transition-all text-sm">
                        <svg class="w-4 h-4 absolute left-3 top-3 text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
                    </div>

                    <!-- F4. Menambah Tugas Baru -->
                    <form id="add-form" class="flex-1 flex gap-2">
                        <input type="text" id="add-input" placeholder="Judul tugas baru..." class="flex-1 px-4 py-2 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500 text-sm">
                        <button type="submit" id="btn-submit" class="bg-indigo-600 hover:bg-indigo-700 text-white px-4 py-2 rounded-lg font-medium transition-colors text-sm whitespace-nowrap">Simpan</button>
                    </form>
                </div>
                <!-- Error Form (F4 Poin 2 & 4) -->
                <p id="form-error" class="text-xs text-red-500 mt-2 font-medium"></p>
            </div>

            <!-- DAFTAR TUGAS -->
            <div class="p-6 flex-1 overflow-y-auto relative">
                <!-- Pesan Loading / Error untuk Tugas -->
                <p id="todos-msg" class="text-sm text-slate-500 italic hidden"></p>
                
                <!--warning pencarian kosong (F3 Poin 4) -->
                <p id="no-match-msg" class="text-sm text-amber-600 bg-amber-50 p-3 rounded-lg border border-amber-200 hidden">Tidak ada tugas yang cocok.</p>
                <ul id="todos-list" class="flex flex-col gap-3"></ul>
            </div>
        </div>

        <!--Toast tugas (F4 Poin 5) -->
        <div id="toast" class="absolute bottom-6 right-6 bg-emerald-500 text-white px-6 py-3 rounded-lg shadow-lg font-medium transition-opacity duration-300 hidden z-50">
            Tugas berhasil ditambahkan.
        </div>

    </main>

    <script src="script.js"></script>
</body>
</html>
