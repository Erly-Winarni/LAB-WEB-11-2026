<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Papan Tugas Tim</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@500;600&display=swap" rel="stylesheet" />
  <style>
    body { font-family: "Geist", system-ui, sans-serif; }
    .font-mono-num { font-family: "Geist Mono", ui-monospace, monospace; }
  </style>
</head>
<body class="min-h-screen bg-slate-50 text-slate-800">
  <div class="mx-auto grid max-w-6xl gap-6 px-4 py-8 md:grid-cols-[16rem_1fr] lg:grid-cols-[20rem_1fr]">

    <!-- Daftar anggota -->
    <aside class="self-start rounded-2xl border border-slate-200 bg-white p-6 shadow-sm">
      <h1 class="text-xl font-semibold text-slate-900">Tim Marsha</h1>
      <h2 class="mt-5 text-sm text-slate-500">Anggota</h2>
      <div id="member-status" aria-live="polite"></div>
      <ul id="member-list" class="mt-2 space-y-1"></ul>
    </aside>

    <!-- Tugas anggota -->
    <section class="overflow-hidden rounded-2xl border border-slate-200 bg-white shadow-sm">
      <div class="flex flex-wrap items-end justify-between gap-x-8 gap-y-4 border-b border-slate-200 px-8 py-8">
        <div>
          <h2 id="task-title" class="text-3xl font-bold text-slate-900">Tugas</h2>
          <p id="summary" class="mt-1 text-slate-500">0 dari 0 tugas selesai</p>
        </div>
        <div class="mb-2 h-1.5 w-full max-w-xs overflow-hidden rounded-full bg-slate-200 sm:w-1/3" role="presentation">
          <div id="progress-bar" class="h-full w-0 rounded-full bg-green-600 transition-all duration-300"></div>
        </div>
      </div>

      <div class="flex flex-wrap gap-3 px-8 pt-6">
        <label for="search" class="sr-only">Cari judul tugas</label>
        <input id="search" type="search" placeholder="Cari judul tugas"
          class="w-full rounded-xl border border-slate-200 bg-slate-50 px-4 py-3 focus:border-blue-600 focus:outline-none focus:ring-2 focus:ring-blue-600/20 sm:w-64" />

        <form id="task-form" class="flex min-w-[16rem] flex-1 gap-3" novalidate>
          <label for="task-input" class="sr-only">Judul tugas baru</label>
          <input id="task-input" type="text" autocomplete="off" placeholder="Tambah tugas baru, minimal 5 karakter"
            class="min-w-0 flex-1 rounded-xl border border-slate-200 bg-white px-4 py-3 focus:border-blue-600 focus:outline-none focus:ring-2 focus:ring-blue-600/20 disabled:bg-slate-50" />
          <button id="task-submit" type="submit"
            class="rounded-xl bg-blue-600 px-6 py-3 font-semibold text-white hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-blue-600/40 disabled:cursor-not-allowed disabled:opacity-60">Simpan</button>
        </form>
      </div>
      <p id="form-error" class="min-h-[2.75rem] px-8 pb-3 pt-2 text-sm font-medium text-red-600" aria-live="polite"></p>

      <div class="border-t border-slate-200">
        <div id="task-status" class="px-8" aria-live="polite"></div>
        <p id="empty-message" class="hidden px-8 py-6 text-slate-500"></p>
        <ul id="task-list"></ul>
      </div>
    </section>
  </div>

  <div id="toast" role="status"
    class="fixed bottom-6 left-1/2 hidden -translate-x-1/2 rounded-xl bg-green-700 px-5 py-3 text-sm font-semibold text-white shadow-lg"></div>

  <script src="script.js"></script>
</body>
</html>
